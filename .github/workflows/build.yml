name: Build test APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: mkdir proj && unzip -q "$(ls *.zip | head -1)" -d proj && ls proj
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: proj/app
        run: |
          npm install
          npm run build:www
          npx cap add android
          npm run patch
          npm run assets || echo "icons skipped"
          npm run sync
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fruit-merge-test-apk
          path: proj/app/android/app/build/outputs/apk/debug/app-debug.apk
